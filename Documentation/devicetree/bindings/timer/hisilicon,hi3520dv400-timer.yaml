%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/hisilicon,hi3520dv400-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3520DV400 SP804 system timers

maintainers:
  - Iscle <albertiscle9@gmail.com>

description: |
  Three SP804 channels provide a free-running counter and separate clock events
  for CPU0 and CPU1. The counter and CPU0 event channels share one interrupt
  line; the free-running channel runs with its interrupt disabled. CPU1 uses
  the first channel of the next dual-timer block and a separate interrupt.

properties:
  compatible:
    const: hisilicon,hi3520dv400-timer
  reg:
    items:
      - description: Free-running clocksource channel
      - description: CPU0 clock event channel
      - description: CPU1 clock event channel
  reg-names:
    items:
      - const: clocksource
      - const: clockevent0
      - const: clockevent1
  interrupts:
    items:
      - description: CPU0 clock event
      - description: CPU1 clock event
  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks

additionalProperties: false
