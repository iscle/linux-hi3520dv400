%YAML 1.2
---
$id: http://devicetree.org/schemas/ata/hisilicon,hi3520dv400-ahci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3520DV400 AHCI controller

maintainers:
  - Iscle <albertiscle9@gmail.com>

allOf:
  - $ref: ahci-common.yaml#

properties:
  compatible:
    const: hisilicon,hi3520dv400-ahci
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  hisilicon,crg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Clock and reset controller containing SATA control registers.
  hisilicon,misc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Miscellaneous system controller containing SATA PHY registers.
  hisilicon,ports:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2]
    default: 1
    description: Number of contiguous SATA ports connected, starting at port zero.

required:
  - compatible
  - reg
  - interrupts
  - hisilicon,crg
  - hisilicon,misc

unevaluatedProperties: false
