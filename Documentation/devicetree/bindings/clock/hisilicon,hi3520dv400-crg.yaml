%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/hisilicon,hi3520dv400-crg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3520DV400 clock and reset controller

maintainers:
  - Iscle <albertiscle9@gmail.com>

properties:
  compatible:
    items:
      - const: hisilicon,hi3520dv400-crg
      - const: syscon
  reg:
    maxItems: 1
  '#clock-cells':
    const: 1
  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false
